name: Linux distro sanity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/linux-distro-sanity.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'socle'
      - 'tools/linux-*.sh'
  push:
    branches:
      - master
      - 'release/**'
    paths:
      - '.github/workflows/linux-distro-sanity.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'socle'
      - 'tools/linux-*.sh'

jobs:
  sanity:
    name: ${{ matrix.name }} / ngtcp2=${{ matrix.ngtcp2 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Older images deliberately test compatibility with ngtcp2 OFF.
        # The build/install scripts themselves always default to ON.
        include:
          - { name: Ubuntu 24.04, slug: ubuntu-24.04, ngtcp2: 'OFF' }
          - { name: Ubuntu 26.04, slug: ubuntu-26.04, ngtcp2: 'ON' }
          - { name: Debian 12, slug: debian-12, ngtcp2: 'OFF' }
          - { name: Debian 13, slug: debian-13, ngtcp2: 'OFF' }
          - { name: Alpine 3.20, slug: alpine-3.20, ngtcp2: 'OFF' }
          - { name: Alpine 3.22, slug: alpine-3.22, ngtcp2: 'OFF' }
          - { name: Fedora 42, slug: fedora-42, ngtcp2: 'OFF' }
          - { name: Fedora 43, slug: fedora-43, ngtcp2: 'ON' }
          - { name: openSUSE Tumbleweed, slug: opensuse-tumbleweed, ngtcp2: 'ON' }
          - { name: AlmaLinux 9, slug: almalinux-9, ngtcp2: 'OFF' }
          - { name: AlmaLinux 10, slug: almalinux-10, ngtcp2: 'OFF' }
          - { name: Rocky Linux 9, slug: rockylinux-9, ngtcp2: 'OFF' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and smoke-test
        run: SMITHPROXY_ENABLE_NGTCP2=${{ matrix.ngtcp2 }} BUILD_JOBS=2 tools/test-linux-distros.sh ${{ matrix.slug }}

  sanity-arm64:
    name: ARM64 / ${{ matrix.name }} / ngtcp2=${{ matrix.ngtcp2 }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Older images deliberately test compatibility with ngtcp2 OFF.
        # The build/install scripts themselves always default to ON.
        include:
          - { name: Ubuntu 26.04, slug: ubuntu-26.04, ngtcp2: 'ON' }
          - { name: Debian 13, slug: debian-13, ngtcp2: 'OFF' }
          - { name: Alpine 3.22, slug: alpine-3.22, ngtcp2: 'OFF' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify native ARM64 runner
        run: test "$(uname -m)" = aarch64

      - name: Build and smoke-test
        run: SMITHPROXY_ENABLE_NGTCP2=${{ matrix.ngtcp2 }} DOCKER_PLATFORM=linux/arm64 BUILD_JOBS=2 tools/test-linux-distros.sh ${{ matrix.slug }}
