name: Publish signed CT log list

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-ctlog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Smithproxy
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake libssl-dev libcurl4-openssl-dev nlohmann-json3-dev

      - name: Build CT updater
        run: cmake -S tools/ctlog -B build-ctlog && cmake --build build-ctlog --parallel

      - name: Cross-check, apply policy, and sign
        env:
          CTLOG_SIGNING_KEY_B64: ${{ secrets.CTLOG_SIGNING_KEY_B64 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CTLOG_SIGNING_KEY_B64"
          test -n "$CLOUDFLARE_API_TOKEN"
          umask 077
          printf '%s' "$CTLOG_SIGNING_KEY_B64" | base64 --decode > signing-key.pem
          trap 'rm -f signing-key.pem' EXIT
          build-ctlog/sx_ctlog publish \
            --apple-url https://valid.apple.com/ct/log_list/current_log_list.json \
            --cloudflare-url https://api.cloudflare.com/client/v4/radar/ct/logs \
            --signer-key signing-key.pem \
            --output-dir publish

      - name: Verify exactly what will be published
        run: |
          set -euo pipefail
          build-ctlog/sx_ctlog update \
            --url "file://$PWD/publish/log_list.json" \
            --signature-url "file://$PWD/publish/log_list.sig" \
            --signer-key tools/ctlog/smithproxy-ctlog-signer.pem \
            --cache-dir "$RUNNER_TEMP/ctlog-cache" \
            --output "$RUNNER_TEMP/ct_log_list.cnf"
          cmp publish/ct_log_list.cnf "$RUNNER_TEMP/ct_log_list.cnf"

      - name: Publish stable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view ctlog-latest >/dev/null 2>&1; then
            gh release create ctlog-latest --target "$GITHUB_SHA" \
              --title 'Smithproxy CT log list' \
              --notes 'Automatically filtered from the Apple CT log policy and signed by Smithproxy.'
          fi
          gh release upload ctlog-latest --clobber \
            publish/log_list.json publish/log_list.sig \
            publish/ct_log_list.cnf publish/policy-report.json \
            tools/ctlog/smithproxy-ctlog-signer.pem
