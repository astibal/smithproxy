name: Build default ngtcp2 (Ubuntu 26.04)

on:
  push:
    branches:
      - master
      - 'release/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0
        persist-credentials: false

    - name: Install dependencies
      run: sudo ./tools/linux-deps.sh

    - name: Build project
      run: DESTDIR="${RUNNER_TEMP}/smithproxy-install" ./tools/linux-build.sh
