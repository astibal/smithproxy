name: Build explicit OpenSSL-only compatibility (Ubuntu 24.04)

on:
  push:
    branches:
      - master
      - 'release/**'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'      

    - name: Install dependencies
      run: sudo env SMITHPROXY_ENABLE_NGTCP2=OFF ./tools/linux-deps.sh

    - name: Build project
      run: sudo env SMITHPROXY_ENABLE_NGTCP2=OFF ./tools/linux-build.sh
