name: Build explicit OpenSSL-only compatibility (Ubuntu 24.04)

on:
  push:
    branches:
      - master
      - 'release/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0
        persist-credentials: false

    - name: Install dependencies
      run: sudo env SMITHPROXY_ENABLE_NGTCP2=OFF ./tools/linux-deps.sh

    - name: Build project
      run: DESTDIR="${RUNNER_TEMP}/smithproxy-install" SMITHPROXY_ENABLE_NGTCP2=OFF ./tools/linux-build.sh
